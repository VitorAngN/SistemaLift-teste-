# Integração contínua: roda `npm test` a cada push na main e em todo pull request.
# Testa na versão mínima suportada (22) e na LTS atual (24).

name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar as dependências (versões exatas do package-lock.json)
        run: npm ci

      - name: Rodar os testes
        run: npm test
